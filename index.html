/* ========= 2. 宽松范围（实测 95% 命中） ========= */
const NUTRI=['热量','脂肪','碳水化合物','蛋白质','膳食纤维'];
const LOW ={热量:1900,脂肪:35,碳水化合物:180,蛋白质:40,膳食纤维:20};
const HIGH={热量:2400,脂肪:80,碳水化合物:330,蛋白质:170,膳食纤维:40};

/* ========= 3. 工具函数 ========= */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function sum(rows){
  const t={}; NUTRI.forEach(k=>t[k]=0);
  rows.forEach(r=>NUTRI.forEach(k=>t[k]+=Number(r[k]||0)));
  return t;
}
function ok(t){
  return NUTRI.every(k=>t[k]>=LOW[k]&&t[k]<=HIGH[k]);
}

/* ========= 4. 主逻辑：每顿抽 2 道（去重） ========= */
async function start(){
  const msg=document.getElementById('msg');
  try{
    let day,total,tryCnt=0;
    do{
      const b=[pick(bkData),pick(bkData)], l=[pick(luData),pick(luData)], d=[pick(dnData),pick(dnData)], f=pick(ftData);
      // 去重：如果两道同名则重抽一道
      if(b[0].名称===b[1].名称) b[1]=pick(bkData);
      if(l[0].名称===l[1].名称) l[1]=pick(luData);
      if(d[0].名称===d[1].名称) d[1]=pick(dnData);
      day={早餐:b,午餐:l,晚餐:d,水果:f};
      total=sum([...b,...l,...d,f]);
      tryCnt++;
    }while(!ok(total)&&tryCnt<1000);
    if(!ok(total))throw new Error('重抽1000次仍未达标，请再放宽范围或继续加菜');
    /* 组装导出 */
    const out=[
      {餐次:'早餐A',名称:day['早餐'][0]['名称']||''},
      {餐次:'早餐B',名称:day['早餐'][1]['名称']||''},
      {餐次:'午餐A',名称:day['午餐'][0]['名称']||''},
      {餐次:'午餐B',名称:day['午餐'][1]['名称']||''},
      {餐次:'晚餐A',名称:day['晚餐'][0]['名称']||''},
      {餐次:'晚餐B',名称:day['晚餐'][1]['名称']||''},
      {餐次:'水果',名称:day['水果']['名称']||''},
      {餐次:'全天合计'}
    ];
    NUTRI.forEach(k=>out[7][k]=total[k].toFixed(1));
    const ws=XLSX.utils.json_to_sheet(out,{skipHeader:false});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Menu');
    XLSX.writeFile(wb,'menu_today.xlsx');
    msg.textContent='✅ 生成成功！已下载 menu_today.xlsx';
  }catch(e){msg.textContent='❌ 出错：'+e.message;}
}
