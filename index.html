<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>随机三餐+水果生成器</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:40px;}
  h2{margin-bottom:10px}
  label{display:block;margin:8px 0}
  button{padding:8px 20px;font-size:16px}
  #msg{margin-top:15px;color:green}
</style>
</head>
<body>
<h2>① 上传 4 个 Excel 文件</h2>
<label>早餐：<input type="file" id="breakfast" accept=".xlsx"></label>
<label>午餐：<input type="file" id="lunch"      accept=".xlsx"></label>
<label>晚餐：<input type="file" id="dinner"     accept=".xlsx"></label>
<label>水果：<input type="file" id="fruit"      accept=".xlsx"></label>

<button onclick="start()">② 生成今日菜单</button>
<div id="msg"></div>

<!-- 依赖：SheetJS 直接 CDN -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const NUTRI=['热量','脂肪','碳水化合物','蛋白质','膳食纤维'];
const LOW ={热量:2000,脂肪:44,碳水化合物:225,蛋白质:50,膳食纤维:25};
const HIGH={热量:2350,脂肪:78,碳水化合物:325,蛋白质:175,膳食纤维:38};

let bk,lu,dn,ft;   // 4 张表数据（数组）

/* 读取文件 */
async function loadFile(id){
  const file=document.getElementById(id).files[0];
  if(!file) throw new Error(id+' 未选择');
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{defval:0});
}
/* 映射列名（容忍空格/大小写） */
function mapCol(obj){
  const o={};
  for(let k in obj){
    const s=k.trim().toLowerCase();
    if(s.includes('热量')||s.includes('kcal')||s.includes('大卡')) o['热量']=obj[k];
    else if(s.includes('脂肪')) o['脂肪']=obj[k];
    else if(s.includes('碳水')||s.includes('糖')) o['碳水化合物']=obj[k];
    else if(s.includes('蛋白质')||s.includes('蛋白')) o['蛋白质']=obj[k];
    else if(s.includes('膳食纤维')||s.includes('纤维')) o['膳食纤维']=obj[k];
  }
  return o;
}
/* 随机抽 1 行 */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
/* 求和 */
function sum(rows){
  const t={热量:0,脂肪:0,碳水化合物:0,蛋白质:0,膳食纤维:0};
  rows.forEach(r=>NUTRI.forEach(k=>t[k]+=Number(r[k]||0)));
  return t;
}
/* 判定范围 */
function ok(t){
  return NUTRI.every(k=>t[k]>=LOW[k]&&t[k]<=HIGH[k]);
}
/* 主逻辑 */
async function start(){
  const msg=document.getElementById('msg');
  try{
    bk=await loadFile('breakfast');
    lu=await loadFile('lunch');
    dn=await loadFile('dinner');
    ft=await loadFile('fruit');
    // 统一列名
    [bk,lu,dn,ft].forEach(arr=>arr.forEach(r=>Object.assign(r,mapCol(r))));
    let day,total,tryCnt=0;
    do{
      const b=pick(bk), l=pick(lu), d=pick(dn), f=pick(ft);
      day={早餐:b,午餐:l,晚餐:d,水果:f};
      total=sum([b,l,d,f]);
      tryCnt++;
    }while(!ok(total)&&tryCnt<1000);
    if(!ok(total)) throw new Error('已重抽 1000 次仍未达标，请放宽范围或增加菜品');
    /* 组装导出 */
    const out=[
      {餐次:'早餐',   选中:day['早餐']['名称']||''}, // 保留名称列
      {餐次:'午餐',   选中:day['午餐']['名称']||''},
      {餐次:'晚餐',   选中:day['晚餐']['名称']||''},
      {餐次:'水果',   选中:day['水果']['名称']||''},
      {餐次:'全天合计'}
    ];
    NUTRI.forEach(k=>out[4][k]=total[k].toFixed(1));
    const ws=XLSX.utils.json_to_sheet(out,{skipHeader:false});
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Menu');
    XLSX.writeFile(wb,'menu_today.xlsx');
    msg.textContent='✅ 生成成功！已下载 menu_today.xlsx';
  }catch(e){ msg.textContent='❌ 出错：'+e.message; }
}
</script>
</body>
</html>
